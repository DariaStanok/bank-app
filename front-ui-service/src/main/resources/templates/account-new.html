<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Создать счёт</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body{font-family:system-ui,Arial,sans-serif;margin:0}
    main{max-width:720px;margin:0 auto;padding:16px}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .card{border:1px solid #ddd;border-radius:12px;padding:16px}
    .muted{color:#666}
    input,select,button{padding:8px}
    .actions{margin-top:12px}
  </style>
</head>
<body>
<main>
  <section class="card">
    <h1>Создать счёт</h1>

    <form th:action="@{/ui/accounts(userId=${userId})}" method="post" th:object="${form}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="row" style="margin-bottom:8px">
        <label>Внешний счёт</label>
        <input type="text" th:field="*{externalAccountId}" placeholder="Например, ****1234"/>
      </div>

      <div class="row" style="margin-bottom:8px">
        <label>Валюта</label>
        <select th:field="*{currency}">
          <option th:each="cur : ${currencies}" th:value="${cur}" th:text="${cur}"></option>
        </select>
      </div>

      <div class="actions">
        <button type="submit">Создать</button>
        <a th:href="@{/ui/accounts(userId=${userId})}">Отмена</a>
      </div>
    </form>
  </section>
</main>
</body>
</html>

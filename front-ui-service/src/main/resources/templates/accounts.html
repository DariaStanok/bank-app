<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Мои счета</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body{font-family:system-ui,Arial,sans-serif;margin:0}
    main{max-width:720px;margin:0 auto;padding:16px}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .card{border:1px solid #ddd;border-radius:12px;padding:16px}
    .muted{color:#666}
    input,select,button{padding:8px}
    .actions{margin-top:12px}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{border:1px solid #ddd;padding:8px;text-align:left}
    th{background:#f9f9f9}
  </style>
</head>
<body>
<main>
  <section class="card">
    <h1>Мои счета</h1>

    <div class="row" style="margin-bottom:8px">
      <a th:href="@{/ui/main(userId=${userId})}">Назад в кабинет</a> |
      <a th:href="@{/ui/accounts/new(userId=${userId})}">Создать счёт</a>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Валюта</th>
          <th>Баланс</th>
          <th>Внешний счёт</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="acc : ${accounts}">
          <td th:text="${acc.id}">1</td>
          <td th:text="${acc.currency}">ILS</td>
          <td th:text="${acc.balance}">0</td>
          <td th:text="${acc.externalAccountId}">****1234</td>
          <td>
            <a th:href="@{|/ui/accounts/${acc.id}/edit?userId=${userId}|}">Редактировать</a>
            <form th:action="@{|/ui/accounts/${acc.id}/delete?userId=${userId}|}"
                  method="post"
                  onsubmit="return confirm('Удалить счёт?');"
                  style="display:inline;">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit">Удалить</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </section>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Редактировать счёт</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body{font-family:system-ui,Arial,sans-serif;margin:0}
    main{max-width:720px;margin:0 auto;padding:16px}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .card{border:1px solid #ddd;border-radius:12px;padding:16px}
    .muted{color:#666}
    input,select,button{padding:8px}
    .actions{margin-top:12px}
  </style>
</head>
<body>
<main>
  <div class="row" style="justify-content:space-between;margin-bottom:12px">
    <h1 style="margin:0">Редактировать счёт</h1>
    <div><a th:href="@{/ui/accounts(userId=${userId})}">← Назад к счетам</a></div>
  </div>

  <div class="muted" style="margin-bottom:8px">
    Измените номер внешнего счёта и при необходимости валюту.
  </div>

  <section class="card">
    <form th:action="@{|/ui/accounts/${accountId}/edit?userId=${userId}|}"
          method="post" th:object="${form}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="row" style="margin-bottom:8px">
        <label for="externalAccountId">Внешний счёт:</label>
        <input id="externalAccountId" type="text" th:field="*{externalAccountId}" placeholder="****1234"/>
      </div>

      <div class="row" style="margin-bottom:8px">
        <label for="currency">Валюта:</label>
        <select id="currency" th:field="*{currency}">
          <option th:each="cur : ${currencies}" th:value="${cur}" th:text="${cur}"></option>
        </select>
      </div>

      <div class="actions">
        <button type="submit">Сохранить</button>
        <a th:href="@{/ui/accounts(userId=${userId})}" class="muted" style="margin-left:8px">Отмена</a>
      </div>
    </form>
  </section>
</main>
</body>
</html>

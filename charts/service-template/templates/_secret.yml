{{- define "service-template.secret" -}}
{{- if .Values.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "service-template.fullname" . }}-secret
  labels:
    {{- include "service-template.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $val := .Values.secret.data }}
  {{ $key }}: "{{ $val }}"
  {{- end }}
{{- end }}
{{- end }}

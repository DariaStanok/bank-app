{{- define "service-template.configmap" -}}
{{- if .Values.config.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "service-template.fullname" . }}-config
  labels:
    {{- include "service-template.labels" . | nindent 4 }}
data:
  {{- range $key, $val := .Values.config.data }}
  {{ $key }}: "{{ $val }}"
  {{- end }}
{{- end }}
{{- end }}

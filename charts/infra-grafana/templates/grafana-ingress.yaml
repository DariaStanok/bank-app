{{- if and .Values.grafana.enabled .Values.grafana.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "infra-grafana.fullname" . }}-grafana
  labels:
    {{- include "infra-grafana.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.grafana.ingress.className | default "nginx" }}
  rules:
    {{- range .Values.grafana.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "infra-grafana.fullname" $ }}-grafana
                port:
                  number: {{ $.Values.grafana.port | default 3000 }}
          {{- end }}
    {{- end }}
  {{- if .Values.grafana.ingress.tls }}
  tls:
    {{- toYaml .Values.grafana.ingress.tls | nindent 4 }}
  {{- end }}
{{- end }}

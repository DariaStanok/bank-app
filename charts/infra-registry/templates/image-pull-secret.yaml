{{- if and .Values.registry.server .Values.registry.username .Values.registry.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.registry.secretName | default "regcred" }}
  labels:
    app.kubernetes.io/name: infra-registry
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\": {\"%s\": {\"username\": \"%s\", \"password\": \"%s\", \"email\": \"%s\", \"auth\": \"%s\"}}}" (.Values.registry.server) (.Values.registry.username) (.Values.registry.password) (default "" .Values.registry.email) (printf "%s:%s" (.Values.registry.username) (.Values.registry.password) | b64enc ) | b64enc }}
{{- end }}

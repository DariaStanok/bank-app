apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-transfer
spec:
  serviceName: postgres-transfer
  replicas: 1
  selector:
    matchLabels:
      app: postgres-transfer
  template:
    metadata:
      labels:
        app: postgres-transfer
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "{{ .Values.postgres.db }}"
            - name: POSTGRES_USER
              value: "{{ .Values.postgres.user }}"
            - name: POSTGRES_PASSWORD
              value: "{{ .Values.postgres.password }}"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-transfer-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-transfer-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.storage.size }}

apiVersion: v2
name: umbrella
description: Umbrella chart for bank-app
type: application
version: 0.1.0

dependencies:
  - name: infra-zipkin 
    version: 0.1.0 
    repository: "file://../infra-zipkin" 
    condition: infra.zipkin.enabled

  - name: infra-prometheus
    version: 0.1.0
    repository: "file://../infra-prometheus"
    condition: infra.prometheus.enabled

  - name: infra-grafana
    version: 0.1.0
    repository: "file://../infra-grafana"
    condition: infra.grafana.enabled

  - name: infra-elk
    version: 0.1.0
    repository: "file://../infra-elk"
    condition: infra.elk.enabled
    
  - name: infra-namespaces
    version: 0.1.0
    repository: "file://../infra-namespaces"
    condition: infra.namespaces.enabled
    
  - name: front-ui
    version: 0.1.0
    repository: "file://../front-ui"

  - name: accounts
    version: 0.1.0
    repository: "file://../accounts"

  - name: cash
    version: 0.1.0
    repository: "file://../cash"

  - name: transfer
    version: 0.1.0
    repository: "file://../transfer"

  - name: notifications
    version: 0.1.0
    repository: "file://../notifications"

  - name: blocker
    version: 0.1.0
    repository: "file://../blocker"

  - name: exchange
    version: 0.1.0
    repository: "file://../exchange"

  - name: exchange-generator
    version: 0.1.0
    repository: "file://../exchange-generator"  
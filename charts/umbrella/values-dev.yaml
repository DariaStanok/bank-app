infra:
  namespaces:
    enabled: true
  zipkin:
    enabled: true
  prometheus:
    enabled: true
  grafana:
    enabled: true
  elk:
    enabled: true

infra-zipkin:
  image:
    repository: openzipkin/zipkin
    tag: latest      

infra-prometheus:
  image:
    repository: prom/prometheus
    tag: v2.54.1

infra-grafana:
  image:
    repository: grafana/grafana
    tag: 11.1.0

infra-elk:
  image:
    repository: sebp/elk
    tag: latest
    
front-ui: 
  image:
    repository: docker.io/dariaku/front-ui
    tag: v2
  imagePullSecrets:
    - name: regcred  


{{- if and .Values.config.enabled .Values.config.data }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.config.name | default "infra-config" }}
  labels:
    app.kubernetes.io/name: infra-config
data:
  {{- range $key, $val := .Values.config.data }}
  {{ $key }}: "{{ $val }}"
  {{- end }}
{{- end }}

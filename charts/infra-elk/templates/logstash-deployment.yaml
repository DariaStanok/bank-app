{{- if .Values.logstash.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infra-elk.fullname" . }}-logstash
  labels:
    {{- include "infra-elk.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.logstash.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/component: logstash
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "infra-elk.labels" . | nindent 8 }}
        app.kubernetes.io/component: logstash
    spec:
      containers:
        - name: logstash
          image: "{{ .Values.logstash.image.repository }}:{{ .Values.logstash.image.tag }}"
          imagePullPolicy: {{ .Values.logstash.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: beats
              containerPort: {{ .Values.logstash.port | default 5044 }}
          {{- if .Values.logstash.resources }}
          resources:
            {{- toYaml .Values.logstash.resources | nindent 12 }}
          {{- end }}
          {{- if .Values.logstash.pipeline }}
          volumeMounts:
            - name: pipeline
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: logstash.conf
          {{- end }}
      {{- if .Values.logstash.pipeline }}
      volumes:
        - name: pipeline
          configMap:
            name: {{ include "infra-elk.fullname" . }}-logstash-pipeline
      {{- end }}
{{- end }}

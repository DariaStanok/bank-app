{{- if .Values.logstash.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "infra-elk.fullname" . }}-logstash
  labels:
    {{- include "infra-elk.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: logstash
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: beats
      port: {{ .Values.logstash.port | default 5044 }}
      targetPort: beats
      protocol: TCP
{{- end }}

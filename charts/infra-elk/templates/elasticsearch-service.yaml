{{- if .Values.elasticsearch.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "infra-elk.fullname" . }}-elasticsearch
  labels:
    {{- include "infra-elk.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: elasticsearch
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.elasticsearch.port | default 9200 }}
      targetPort: http
      protocol: TCP
{{- end }}

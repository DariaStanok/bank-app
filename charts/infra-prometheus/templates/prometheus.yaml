apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "service-template.fullname" . }}-config
  labels:
    {{- include "service-template.labels" . | nindent 4 }}
data:
  prometheus.yml: |-
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval | default "10s" }}
      evaluation_interval: {{ .Values.prometheus.evaluationInterval | default "10s" }}

    scrape_configs:
      - job_name: 'kubernetes-services'
        kubernetes_sd_configs:
          - role: endpoints

        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"

          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: "(.+)"
            replacement: "$1"

          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_port, __address__]
            action: replace
            regex: "([^;]+);([^:]+)(?::\d+)?"
            replacement: "$2:$1"
            target_label: __address__

          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)

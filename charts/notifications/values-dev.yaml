image:
  repository: docker.io/dariaku/notifications-service   

env:
  SPRING_PROFILES_ACTIVE: dev
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-notifications.dev.svc.cluster.local:5432/bank?currentSchema=notifications"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://auth:8080/auth"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
  APP_KAFKA_BOOTSTRAP_SERVERS: ""
  APP_KAFKA_NOTIFICATIONS_TOPIC: ""
  APP_KAFKA_CONSUMER_GROUP_ID: ""

clients: {}         

ingress:
  enabled: false